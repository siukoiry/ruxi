<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#070708" />
  <title>入戏</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="mark">入</span>
        <div>
          <strong>入戏</strong>
          <em>RP Stage</em>
        </div>
      </div>
      <div class="top-actions">
        <span id="api-pill" class="pill off">未接模型</span>
        <button id="btn-call-demo" class="ghost">来电</button>
      </div>
    </header>
    <nav class="tabs">
      <button data-tab="stage" class="on">舞台</button>
      <button data-tab="kit">组件</button>
      <button data-tab="json">协议</button>
      <button data-tab="api">接口</button>
    </nav>
    <main id="view-stage" class="view on">
      <section class="stream" id="stream"></section>
      <form id="composer" class="composer">
        <input id="user-input" autocomplete="off" placeholder="说一句，或点下方快捷…" />
        <button type="submit">发送</button>
      </form>
      <div class="quick" id="quick"></div>
    </main>
    <main id="view-kit" class="view">
      <p class="hint">每个模块单独长什么样。以后接 API 就按这些壳画。</p>
      <div id="kit-list" class="stream"></div>
    </main>
    <main id="view-api" class="view">
      <p class="hint">兼容 OpenAI 格式的接口都能接：DeepSeek、OpenAI、OpenRouter、Groq、硅基流动、月之暗面等。密钥只存在这台设备的浏览器里。</p>
      <p class="hint warn">很多官方 API 会拦跨域。打不开就填中转地址。</p>
      <label>预设</label>
      <select id="api-preset"></select>
      <label>接口地址 Base URL</label>
      <input id="api-base" placeholder="https://api.deepseek.com/v1" />
      <label>模型名</label>
      <input id="api-model" placeholder="deepseek-chat" />
      <label>API Key</label>
      <input id="api-key" type="password" placeholder="sk-…" autocomplete="off" />
      <label>跨域中转（可选）</label>
      <input id="api-proxy" placeholder="https://your-proxy.com" />
      <label>人设 / 系统提示</label>
      <textarea id="api-system" class="short"></textarea>
      <div class="row">
        <button id="btn-save-api" class="primary">保存</button>
        <button id="btn-test-api" class="ghost">测试连接</button>
        <button id="btn-clear-api" class="ghost">清除密钥</button>
      </div>
      <p id="api-status" class="hint"></p>
    </main>
    <main id="view-json" class="view">
      <p class="hint">模型以后只输出这种 JSON。可编辑后点「渲染到舞台」。</p>
      <textarea id="json-box" spellcheck="false"></textarea>
      <div class="row">
        <button id="btn-render-json" class="primary">渲染到舞台</button>
        <button id="btn-fill-demo" class="ghost">填入示例</button>
      </div>
    </main>
  </div>
  <div id="call-layer" class="call-layer" hidden>
    <p class="call-kicker">来电</p>
    <div class="call-avatar">同</div>
    <h2 id="call-name">海口同城会</h2>
    <p id="call-sub">微信视频通话</p>
    <div class="call-actions">
      <button id="btn-decline" class="round red">拒绝</button>
      <button id="btn-accept" class="round green">接听</button>
    </div>
  </div>
  <script src="./js/demo.js"></script>
  <script src="./js/render.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
